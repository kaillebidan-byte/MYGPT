<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT VoiceBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>ChatGPT VoiceBridge</h1>

    <label class="check">
      <input id="enabled" type="checkbox">
      新しい最終回答を読み上げる
    </label>

    <label>
      VoiceBridge URL
      <input id="endpoint" type="url" spellcheck="false">
    </label>

    <label>
      トークン
      <input id="token" type="password" autocomplete="off" spellcheck="false">
    </label>

    <label class="check">
      <input id="debugEnabled" type="checkbox">
      判定ログを記録する
    </label>

    <p class="hint">
      別タブ中に本文DOMが止まった場合は完了通知を読み、戻った後に全文を読む。<br>
      ログには本文やトークンを保存せず、判定理由・文字数・応答IDだけを残す。
    </p>

    <div class="buttons">
      <button id="save" type="button">保存</button>
      <button id="test" type="button">読み上げテスト</button>
    </div>

    <p id="status" role="status"></p>
    <p id="monitorStatus" class="monitor-status">監視接続を確認中…</p>

    <section class="debug">
      <h2>判定ログ</h2>
      <div class="buttons">
        <button id="refreshLogs" type="button">更新</button>
        <button id="copyLogs" type="button">コピー</button>
        <button id="clearLogs" type="button">消去</button>
      </div>
      <textarea id="debugLogs" readonly spellcheck="false"
                placeholder="「判定ログを記録する」を有効にすると、ここへ表示される。"></textarea>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
