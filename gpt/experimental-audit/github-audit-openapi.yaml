openapi: 3.1.0
info:
  title: MYGPT Experimental Sprite Audit Receiver
  version: 0.1.0
  description: >-
    Experimental contract for receiving one image file reference from a Custom GPT,
    storing the image long enough for processing, dispatching the GitHub audit workflow,
    and returning a stable audit identifier. This schema requires a separately deployed
    receiver service. Do not point it directly at api.github.com.
servers:
  - url: https://REPLACE_WITH_AUDIT_RECEIVER
paths:
  /audits:
    post:
      operationId: submitSpriteAudit
      summary: Submit one generated sprite image for audit
      description: >-
        Accept exactly one generated image from the current conversation. The receiver
        must download the temporary file URL immediately, validate the MIME type,
        store it in temporary controlled storage, and then start the GitHub audit workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - openaiFileIdRefs
                - request_id
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  description: Exactly one PNG, WebP, or JPEG image generated in the current conversation.
                  items:
                    type: string
                request_id:
                  type: string
                  minLength: 1
                  maxLength: 80
                  pattern: '^[A-Za-z0-9._-]+$'
                expected_states:
                  type: string
                  default: ''
                  description: Comma-separated active states in top-to-bottom row order.
                spec_name:
                  type: string
                  enum:
                    - pet-atlas-8x9
                  default: pet-atlas-8x9
                normalize:
                  type: boolean
                  default: true
                publish_issue:
                  type: boolean
                  default: true
      responses:
        '202':
          description: Audit accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditStatus'
        '400':
          description: Invalid request or unsupported image
        '401':
          description: Authentication failed
        '409':
          description: Duplicate request identifier
        '422':
          description: File reference could not be resolved
        '503':
          description: Audit receiver or GitHub dispatch unavailable
  /audits/{audit_id}:
    get:
      operationId: getSpriteAudit
      summary: Read the current audit status and result
      parameters:
        - name: audit_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '200':
          description: Current audit status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditStatus'
        '401':
          description: Authentication failed
        '404':
          description: Audit identifier not found
components:
  schemas:
    AuditStatus:
      type: object
      additionalProperties: false
      required:
        - audit_id
        - request_id
        - status
      properties:
        audit_id:
          type: string
        request_id:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - passed
            - failed
            - error
        github_run_url:
          type:
            - string
            - 'null'
          format: uri
        report_url:
          type:
            - string
            - 'null'
          format: uri
        failed_rows:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              row:
                type: integer
                minimum: 1
              state:
                type: string
              issues:
                type: array
                items:
                  type: string
        repair_instruction:
          type:
            - string
            - 'null'
        message:
          type:
            - string
            - 'null'
  securitySchemes:
    receiverToken:
      type: http
      scheme: bearer
security:
  - receiverToken: []
