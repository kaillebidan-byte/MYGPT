<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MYGPT Worker Fanout v4</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 440px; margin: 12px; color: #111; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display: block; font-size: 12px; font-weight: 650; margin: 10px 0 4px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 74px; resize: vertical; font: 12px/1.35 ui-monospace, monospace; }
    button { margin: 6px 6px 0 0; }
    .status { margin-top: 10px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
    .slot { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; }
    .mono { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    .error { color: #a00; white-space: pre-wrap; max-height: 140px; overflow: auto; }
    .small { font-size: 11px; color: #555; }
  </style>
</head>
<body>
  <h1>MYGPT Worker Fanout v4.3 — sequential isolated workers</h1>

  <label for="canonical">Canonical image</label>
  <input id="canonical" type="file" accept="image/*">
  <div id="fileInfo" class="small">未選択</div>

  <label for="F2">F2 packet</label>
  <textarea id="F2">[MYGPT_V4_F2_TEST]
単独の1状態だけを生成。F2テスト。</textarea>

  <label for="F3">F3 packet</label>
  <textarea id="F3">[MYGPT_V4_F3_TEST]
単独の1状態だけを生成。F3テスト。</textarea>

  <label for="F4">F4 packet</label>
  <textarea id="F4">[MYGPT_V4_F4_TEST]
単独の1状態だけを生成。F4テスト。</textarea>

  <button id="run" disabled>F2→F3→F4を順次隔離生成</button>
  <button id="reset">worker tabsをリセット</button>

  <div class="status">
    <div>Phase: <span id="phase" class="mono">IDLE</span></div>
    <div>Worker: <span id="worker" class="mono">-</span></div>
    <div>File: <span id="stateFile" class="mono">-</span></div>
    <div id="slots"></div>
    <div id="error" class="error"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
