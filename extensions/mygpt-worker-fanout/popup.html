<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MYGPT Worker Fanout</title>
  <style>
    body { font-family: system-ui, sans-serif; min-width: 360px; margin: 14px; color: #202124; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    h2 { font-size: 14px; margin: 14px 0 6px; }
    p { font-size: 12px; line-height: 1.5; margin: 8px 0; }
    button { width: 100%; padding: 8px 10px; margin-top: 8px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 96px; resize: vertical; font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .status { padding: 9px; border: 1px solid #c7c7c7; border-radius: 6px; background: #f7f7f7; }
    .label { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .warning { font-weight: 700; }
    #error, #gate1Error { color: #9c1c1c; }
  </style>
</head>
<body>
  <h1>MYGPT Worker Fanout — Gate 0 / Gate 1</h1>

  <h2>Gate 0 — worker identity</h2>
  <div class="status">
    <div><span class="label">Status:</span> <span id="status">読込中</span></div>
    <div><span class="label">Expected:</span> <span id="expected" class="mono">-</span></div>
    <div><span class="label">Observed:</span> <span id="observed" class="mono">-</span></div>
    <div><span class="label">Tab:</span> <span id="tabId" class="mono">-</span></div>
    <div id="error"></div>
  </div>
  <button id="start" type="button">Gate 0を実行</button>
  <button id="reset" type="button">全状態をリセット</button>

  <h2>Gate 1 — packet挿入のみ</h2>
  <p class="warning">このGateでは送信しない。file添付・画像生成も行わない。</p>
  <textarea id="packet" spellcheck="false">[MYGPT_GATE1_TEST]
mode=INSERT_ONLY
submit=FORBIDDEN
purpose=verify_composer_insertion</textarea>
  <div class="status">
    <div><span class="label">Gate1:</span> <span id="gate1Status">-</span></div>
    <div><span class="label">Composer:</span> <span id="composerKind" class="mono">-</span></div>
    <div><span class="label">Method:</span> <span id="insertionMethod" class="mono">-</span></div>
    <div><span class="label">Chars:</span> <span id="packetChars" class="mono">-</span></div>
    <div id="gate1Error"></div>
  </div>
  <button id="gate1Insert" type="button">Gate 1 packetをowned tabへ挿入</button>
  <button id="gate1Reset" type="button">Gate 1状態だけリセット</button>

  <script src="popup.js"></script>
</body>
</html>
