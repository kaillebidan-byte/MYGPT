name: temp-install-worker-fanout-v040
on:
  push:
    paths:
      - .github/workflows/temp-install-worker-fanout-v040.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore tested v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v040
          cat .github/v040-payload/part00 \
              .github/v040-payload/part01 \
              .github/v040-payload/part02 \
              .github/v040-payload/part03 \
              .github/v040-payload/part04 \
            | base64 -d \
            | tar -xz -C /tmp/v040
          rm -rf extensions/mygpt-worker-fanout-v3
          cp -a /tmp/v040/mygpt-worker-fanout-v3 extensions/mygpt-worker-fanout-v3
      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          cd extensions/mygpt-worker-fanout-v3
          python -m json.tool manifest.json >/dev/null
          for f in *.js tests/*.js; do node --check "$f"; done
          for t in tests/*.js; do node "$t"; done
          test "$(node -p "require('./manifest.json').version")" = "0.4.0"
          test ! -e translation_loop_send_guard.js
      - name: Commit v0.4.0 and remove installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/v040-payload
          rm .github/workflows/temp-install-worker-fanout-v040.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Worker Fanout v0.4.0: reuse Translation Loop control plane"
          git push origin HEAD:main
