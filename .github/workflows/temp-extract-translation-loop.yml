name: TEMP Extract Translation Loop 0.5.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-extract-translation-loop.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and extract user-authored extension
        shell: bash
        run: |
          set -euo pipefail
          base='research/temp-extension-sources/chatgpt-translation-loop-test-0.5.1.zip.b64'
          cat "${base}".part* | base64 -d > /tmp/translation-loop.zip
          echo '2c10ed7156ad30fbb8454fa962cff604e24a5ad029f4406d92576fe9400e1b2a  /tmp/translation-loop.zip' | sha256sum -c -
          rm -rf research/temp-extension-sources/translation-loop-0.5.1-extracted
          mkdir -p research/temp-extension-sources/translation-loop-0.5.1-extracted
          unzip -q /tmp/translation-loop.zip -d /tmp/translation-loop-unpacked
          src_dir="$(find /tmp/translation-loop-unpacked -mindepth 1 -maxdepth 1 -type d | head -n1)"
          cp -a "$src_dir"/. research/temp-extension-sources/translation-loop-0.5.1-extracted/
      - name: Commit extracted temporary source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/temp-extension-sources/translation-loop-0.5.1-extracted
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Temporarily extract Translation Loop 0.5.1 source for fanout reuse'
          git push
