name: Test Project configuration

on:
  push:
    paths:
      - "project/**"
      - "audit/scripts/compose_keypose_board_from_frames.py"
      - "research/hatch-pet-porting.md"
      - "README.md"
      - ".github/workflows/test-project-config.yml"
  pull_request:
    paths:
      - "project/**"
      - "audit/scripts/compose_keypose_board_from_frames.py"
      - "research/hatch-pet-porting.md"
      - "README.md"
      - ".github/workflows/test-project-config.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Project layout
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "project/README.md",
              "project/instructions/project-instructions.md",
              "project/instructions/post-generation-review-test.md",
              "project/sources/production/README.md",
              "project/sources/production/01-character-identity.md",
              "project/sources/production/02-motion-design.md",
              "project/sources/production/03-keypose-board-spec.md",
              "project/sources/production/04-imagegen-workflow.md",
              "project/sources/production/05-post-generation-audit.md",
              "project/sources/layout-guides/README.md",
              "project/sources/reference-images/README.md",
              "audit/scripts/compose_keypose_board_from_frames.py",
          ]
          for item in required:
              path = Path(item)
              assert path.is_file(), f"Missing required file: {item}"
              assert path.stat().st_size > 0, f"Empty required file: {item}"

          instructions = Path("project/instructions/project-instructions.md").read_text(encoding="utf-8")
          for phrase in [
              "1 visual job = 1 frame",
              "人物1体の単独全身ポーズ1枚",
              "compose_keypose_board_from_frames.py",
              "four-pose-portrait.png`をProject Sourceとして使わない",
              "repairは1 roundのみ",
          ]:
              assert phrase in instructions, f"Project instructions missing: {phrase}"
          for forbidden in [
              "1 visual job = 1 motion board",
              "K1、K2、K3、K4を4枚の独立画像として生成しない",
              "/mnt/data",
              "sandbox:/",
          ]:
              assert forbidden not in instructions, f"Obsolete/runtime phrase remains: {forbidden}"

          identity = Path("project/sources/production/01-character-identity.md").read_text(encoding="utf-8")
          for phrase in ["最高解像度", "topology", "occlusion", "基準画像そのものより、この文書を優先してはいけない"]:
              assert phrase in identity, f"Identity source missing: {phrase}"

          motion = Path("project/sources/production/02-motion-design.md").read_text(encoding="utf-8")
          for phrase in ["F1", "F4", "continuity_invariants", "左上・右上などの最終配置情報をmotion contractへ混ぜない"]:
              assert phrase in motion, f"Motion source missing: {phrase}"

          frame_spec = Path("project/sources/production/03-keypose-board-spec.md").read_text(encoding="utf-8")
          for phrase in ["画像生成モデルへ2×2ボードを直接描かせない", "1体だけ", "deterministic 2x2 compose", "four-pose-portrait.png`をChatGPT Project Sourceとして使わない"]:
              assert phrase in frame_spec, f"Frame spec missing: {phrase}"

          workflow = Path("project/sources/production/04-imagegen-workflow.md").read_text(encoding="utf-8")
          for phrase in ["1 visual job = 1 frame", "4つの単独画像生成job", "failed-frame", "deterministic compose"]:
              assert phrase in workflow, f"Workflow missing: {phrase}"

          audit = Path("project/sources/production/05-post-generation-audit.md").read_text(encoding="utf-8")
          for phrase in ["FRAME_REPAIR_PLAN", "FRAME_SOURCE_DECISION", "compose_keypose_board_from_frames.py", "2回目repairは禁止"]:
              assert phrase in audit, f"Audit source missing: {phrase}"

          layout = Path("project/sources/layout-guides/README.md").read_text(encoding="utf-8")
          assert "Project Sourceへ追加しない" in layout
          assert "すでにProject Sourceへ`four-pose-portrait.png`を追加している場合は削除" in layout

          reference = Path("project/sources/reference-images/README.md").read_text(encoding="utf-8")
          assert "高解像度" in reference

          composer = Path("audit/scripts/compose_keypose_board_from_frames.py").read_text(encoding="utf-8")
          for phrase in ["--frames", "common_scale", "center-gap-x", "center-gap-y"]:
              assert phrase in composer, f"Composer missing: {phrase}"

          print("Project frame-first configuration validation passed")
          PY

      - name: Syntax check composer
        run: python -m py_compile audit/scripts/compose_keypose_board_from_frames.py
