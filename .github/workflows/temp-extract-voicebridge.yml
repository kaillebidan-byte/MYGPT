name: TEMP Extract VoiceBridge 0.2.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-extract-voicebridge.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and extract VoiceBridge
        shell: bash
        run: |
          set -euo pipefail
          src='research/temp-extension-sources/chatgpt_voicebridge_extension_0.2.6.zip.b64'
          base64 -d "$src" > /tmp/voicebridge.zip
          rm -rf research/temp-extension-sources/voicebridge-0.2.6-extracted /tmp/voicebridge-unpacked
          mkdir -p research/temp-extension-sources/voicebridge-0.2.6-extracted /tmp/voicebridge-unpacked
          unzip -q /tmp/voicebridge.zip -d /tmp/voicebridge-unpacked
          src_dir="$(find /tmp/voicebridge-unpacked -mindepth 1 -maxdepth 1 -type d | head -n1)"
          cp -a "$src_dir"/. research/temp-extension-sources/voicebridge-0.2.6-extracted/
      - name: Commit extracted temporary source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/temp-extension-sources/voicebridge-0.2.6-extracted
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Temporarily extract VoiceBridge 0.2.6 source for fanout reuse'
          git push
