name: Audit sprite atlas
run-name: sprite-audit-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: Public image URL, GitHub blob/raw URL, or public Google Drive share URL
        required: true
        type: string
      request_id:
        description: Unique ID used to correlate the run and optional issue report
        required: true
        type: string
      expected_states:
        description: Comma-separated active row states. Empty means all official 9 states.
        required: false
        default: ""
        type: string
      spec_path:
        description: Repository-relative audit specification path
        required: false
        default: specs/pet-atlas-8x9.json
        type: string
      normalize:
        description: Produce normalized-spritesheet.webp
        required: false
        default: true
        type: boolean
      publish_issue:
        description: Publish or update a parseable audit report as a GitHub issue
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download input image
        run: python scripts/download_input.py "${{ inputs.image_url }}" work/input-image

      - name: Audit sprite atlas
        id: audit
        shell: bash
        run: |
          set +e
          args=(
            work/input-image
            --spec "${{ inputs.spec_path }}"
            --output-dir audit-output
          )
          if [[ -n "${{ inputs.expected_states }}" ]]; then
            args+=(--expected-states "${{ inputs.expected_states }}")
          fi
          if [[ "${{ inputs.normalize }}" == "false" ]]; then
            args+=(--no-normalize)
          fi
          python scripts/audit_sprite.py "${args[@]}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write job summary and issue body
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("audit-output/audit.json").read_text(encoding="utf-8"))
          status = "PASS" if report["passed"] else "FAIL"
          failed = [row for row in report.get("rows", []) if not row["passed"]]
          warnings = [
              (row["row"], row["state"], warning["code"])
              for row in report.get("rows", [])
              for warning in row.get("warnings", [])
          ]
          lines = [
              f"# Sprite audit: {status}",
              "",
              f"- Request ID: `{os.environ['REQUEST_ID']}`",
              f"- Run: {os.environ['RUN_URL']}",
              f"- Canvas: `{report['canvas']['actual']['width']}×{report['canvas']['actual']['height']}`",
              f"- Transparency check: `{'pass' if report['transparency']['passed'] else 'fail'}`",
              f"- Failed rows: `{len(failed)}`",
              "",
          ]
          if failed:
              lines += ["## Failed rows", "", "| Row | State | Issues |", "|---:|---|---|"]
              for row in failed:
                  issue_codes = ", ".join(issue["code"] for issue in row["issues"])
                  lines.append(f"| {row['row']} | `{row['state']}` | {issue_codes} |")
              lines.append("")
          if warnings:
              lines += ["## Warnings", ""]
              lines += [f"- Row {row} `{state}`: {code}" for row, state, code in warnings]
              lines.append("")
          if report.get("repair_instruction"):
              lines += ["## Repair instruction", "", report["repair_instruction"], ""]
          lines += [
              "## Outputs",
              "",
              "Download the `sprite-audit-<request-id>` artifact from the workflow run. It contains:",
              "",
              "- `audit.json`",
              "- `contact-sheet.png`",
              "- `preview.gif`",
              "- `normalized-spritesheet.webp` when normalization is enabled",
          ]
          body = "\n".join(lines)
          Path("audit-output/issue-body.md").write_text(body, encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(body, encoding="utf-8")
          PY

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: sprite-audit-${{ inputs.request_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish audit issue
        if: ${{ inputs.publish_issue }}
        uses: actions/github-script@v7
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        with:
          script: |
            const fs = require('fs');
            const title = `[sprite-audit] ${process.env.REQUEST_ID}`;
            const body = fs.readFileSync('audit-output/issue-body.md', 'utf8');
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'sprite-audit',
                color: '6f42c1',
                description: 'Machine-readable sprite quality audit report'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sprite-audit',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sprite-audit']
              });
            }

      - name: Mark workflow failed after artifacts are saved
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit "${{ steps.audit.outputs.exit_code }}"
