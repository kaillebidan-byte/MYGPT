name: Audit sprite atlas
run-name: sprite-audit-${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [sprite_audit]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audit/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r audit/requirements.txt

      - name: Receive image from audit receiver
        shell: bash
        env:
          AUDIT_IMAGE_HOST: ${{ vars.AUDIT_IMAGE_HOST }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from PIL import Image

          MAX_IMAGE_BYTES = 50 * 1024 * 1024
          SAFE_ID = re.compile(r"^[A-Za-z0-9._-]{1,120}$")
          SAFE_STATES = re.compile(r"^(?:[A-Za-z0-9._-]+(?:,[A-Za-z0-9._-]+)*)?$")

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          payload = event.get("client_payload") or {}

          request_id = str(payload.get("request_id") or "").strip()
          audit_id = str(payload.get("audit_id") or request_id).strip()
          if not SAFE_ID.fullmatch(request_id):
              raise SystemExit("request_id must contain only letters, numbers, dot, underscore, or hyphen")
          if not SAFE_ID.fullmatch(audit_id):
              raise SystemExit("audit_id must contain only letters, numbers, dot, underscore, or hyphen")

          expected_states = str(payload.get("expected_states") or "").strip()
          if not SAFE_STATES.fullmatch(expected_states):
              raise SystemExit("expected_states must be a comma-separated list of safe state names")

          spec_name = str(payload.get("spec_name") or "pet-atlas-8x9").strip()
          if spec_name != "pet-atlas-8x9":
              raise SystemExit(f"Unsupported spec_name: {spec_name}")
          spec_path = "audit/specs/pet-atlas-8x9.json"

          image_url = str(payload.get("image_url") or "").strip()
          parsed = urllib.parse.urlparse(image_url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("image_url must be an HTTPS URL without embedded credentials")

          allowed_host = str(os.environ.get("AUDIT_IMAGE_HOST") or "").strip().lower()
          if not allowed_host:
              raise SystemExit("Repository variable AUDIT_IMAGE_HOST is required")
          if parsed.hostname.lower() != allowed_host:
              raise SystemExit("image_url host is not allowed")

          source_name = str(payload.get("image_name") or "input-image").strip()
          source_name = re.sub(r"[^A-Za-z0-9._-]+", "_", source_name)[:120] or "input-image"

          request = urllib.request.Request(
              image_url,
              headers={
                  "User-Agent": "MYGPT-sprite-auditor/2.0",
                  "Accept": "image/png,image/webp,image/jpeg",
              },
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              final_url = urllib.parse.urlparse(response.geturl())
              if final_url.scheme != "https" or final_url.hostname.lower() != allowed_host:
                  raise SystemExit("Image download redirected to a disallowed host")
              payload_bytes = response.read(MAX_IMAGE_BYTES + 1)

          if len(payload_bytes) > MAX_IMAGE_BYTES:
              raise SystemExit("Image exceeds the 50 MB audit limit")

          temp = Path("work/input-image.download")
          temp.parent.mkdir(parents=True, exist_ok=True)
          temp.write_bytes(payload_bytes)

          try:
              with Image.open(temp) as image:
                  image.verify()
                  image_format = str(image.format or "").upper()
          except Exception as exc:
              raise SystemExit(f"Downloaded payload is not a valid image: {exc}") from exc

          suffixes = {"PNG": ".png", "WEBP": ".webp", "JPEG": ".jpg"}
          if image_format not in suffixes:
              raise SystemExit(f"Unsupported image format: {image_format}")

          output = Path("work/input-image" + suffixes[image_format])
          temp.replace(output)

          normalize = str(bool(payload.get("normalize", True))).lower()
          publish_issue = str(bool(payload.get("publish_issue", True))).lower()

          values = {
              "INPUT_IMAGE": str(output),
              "REQUEST_ID": request_id,
              "AUDIT_ID": audit_id,
              "EXPECTED_STATES": expected_states,
              "SPEC_PATH": spec_path,
              "NORMALIZE": normalize,
              "PUBLISH_ISSUE": publish_issue,
              "SOURCE_FILE_NAME": source_name,
          }
          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Audit sprite atlas
        id: audit
        shell: bash
        run: |
          set +e
          args=(
            "$INPUT_IMAGE"
            --spec "$SPEC_PATH"
            --output-dir audit-output
          )
          if [[ -n "$EXPECTED_STATES" ]]; then
            args+=(--expected-states "$EXPECTED_STATES")
          fi
          if [[ "$NORMALIZE" == "false" ]]; then
            args+=(--no-normalize)
          fi
          python audit/scripts/audit_sprite.py "${args[@]}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write job summary and issue body
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("audit-output/audit.json").read_text(encoding="utf-8"))
          status = "PASS" if report["passed"] else "FAIL"
          failed = [row for row in report.get("rows", []) if not row["passed"]]
          warnings = [
              (row["row"], row["state"], warning["code"])
              for row in report.get("rows", [])
              for warning in row.get("warnings", [])
          ]
          lines = [
              f"# Sprite audit: {status}",
              "",
              f"- Audit ID: `{os.environ['AUDIT_ID']}`",
              f"- Request ID: `{os.environ['REQUEST_ID']}`",
              f"- Source file: `{os.environ.get('SOURCE_FILE_NAME', '')}`",
              f"- Run: {os.environ['RUN_URL']}",
              f"- Canvas: `{report['canvas']['actual']['width']}×{report['canvas']['actual']['height']}`",
              f"- Transparency check: `{'pass' if report['transparency']['passed'] else 'fail'}`",
              f"- Failed rows: `{len(failed)}`",
              "",
          ]
          if failed:
              lines += ["## Failed rows", "", "| Row | State | Issues |", "|---:|---|---|"]
              for row in failed:
                  issue_codes = ", ".join(issue["code"] for issue in row["issues"])
                  lines.append(f"| {row['row']} | `{row['state']}` | {issue_codes} |")
              lines.append("")
          if warnings:
              lines += ["## Warnings", ""]
              lines += [f"- Row {row} `{state}`: {code}" for row, state, code in warnings]
              lines.append("")
          if report.get("repair_instruction"):
              lines += ["## Repair instruction", "", report["repair_instruction"], ""]
          lines += [
              "## Outputs",
              "",
              "Download the `sprite-audit-<request-id>` artifact from the workflow run. It contains:",
              "",
              "- `audit.json`",
              "- `contact-sheet.png`",
              "- `preview.gif`",
              "- `normalized-spritesheet.webp` when normalization is enabled",
          ]
          body = "\n".join(lines)
          Path("audit-output/issue-body.md").write_text(body, encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(body, encoding="utf-8")
          PY

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: sprite-audit-${{ env.REQUEST_ID }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish audit issue
        if: ${{ env.PUBLISH_ISSUE != 'false' }}
        uses: actions/github-script@v7
        env:
          REQUEST_ID: ${{ env.REQUEST_ID }}
        with:
          script: |
            const fs = require('fs');
            const title = `[sprite-audit] ${process.env.REQUEST_ID}`;
            const body = fs.readFileSync('audit-output/issue-body.md', 'utf8');
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'sprite-audit',
                color: '6f42c1',
                description: 'Machine-readable sprite quality audit report'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sprite-audit',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sprite-audit']
              });
            }

      - name: Mark workflow failed after artifacts are saved
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit "${{ steps.audit.outputs.exit_code }}"
