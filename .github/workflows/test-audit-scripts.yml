name: Test sprite audit scripts

on:
  push:
    paths:
      - "audit/scripts/**"
      - "audit/specs/**"
      - "audit/docs/**"
      - "audit/requirements.txt"
      - ".github/workflows/test-audit-scripts.yml"
  pull_request:
    paths:
      - "audit/scripts/**"
      - "audit/specs/**"
      - "audit/docs/**"
      - "audit/requirements.txt"
      - ".github/workflows/test-audit-scripts.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audit/requirements.txt

      - run: python -m pip install -r audit/requirements.txt

      - name: Create layout guide and synthetic chroma boards
        run: |
          mkdir -p test-output
          python audit/scripts/build_motion_layout_guide.py \
            --output test-output/four-pose-portrait.png \
            --metadata test-output/four-pose-portrait.json

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          output = Path("test-output")
          output.mkdir(exist_ok=True)

          atlas = Image.new("RGBA", (1536, 1872), (0, 0, 0, 0))
          draw = ImageDraw.Draw(atlas)
          for row in range(9):
              for column in range(8):
                  left = column * 192 + 64 + column * 4
                  top = row * 208 + 80
                  draw.ellipse(
                      (left, top, left + 56, top + 84),
                      fill=(70 + row * 12, 130, 220, 255),
                  )
          atlas.save(output / "synthetic-atlas.png")

          def make_chroma_board(path: Path, offset: int) -> None:
              image = Image.new("RGB", (1024, 1536), (255, 0, 255))
              board = ImageDraw.Draw(image)

              # Reproduce the small chroma variation observed in generated boards.
              # The old threshold left these center safe-gap pixels partially opaque,
              # which made split-cell alpha bboxes touch their edges.
              board.rectangle((502, 0, 521, 1535), fill=(240, 8, 225))
              board.rectangle((0, 758, 1023, 777), fill=(240, 8, 225))

              for index, (row, column) in enumerate(((0, 0), (0, 1), (1, 0), (1, 1))):
                  left = column * 512 + 150 + offset + index * 4
                  top = row * 768 + 170 + index * 8
                  board.ellipse(
                      (left, top, left + 160, top + 330),
                      fill=(245, 180 - index * 10, 45 + index * 20),
                  )
                  board.rectangle(
                      (left + 118, top - 54 + index * 7, left + 148, top + 120),
                      fill=(245, 180 - index * 10, 45 + index * 20),
                  )
              image.save(path)

          make_chroma_board(output / "keyposes-raw.png", 0)
          make_chroma_board(output / "inbetweens-raw.png", 8)
          PY

      - name: Remove chroma backgrounds
        run: |
          python audit/scripts/remove_chroma_key.py \
            test-output/keyposes-raw.png \
            --output test-output/keyposes.png \
            --metadata test-output/keyposes-chroma.json

          python audit/scripts/remove_chroma_key.py \
            test-output/inbetweens-raw.png \
            --output test-output/inbetweens.png \
            --metadata test-output/inbetweens-chroma.json

      - name: Verify layout guide and chroma removal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          guide = Image.open("test-output/four-pose-portrait.png")
          assert guide.size == (1024, 1536), guide.size

          raw = Image.open("test-output/keyposes-raw.png").convert("RGBA")
          clean = Image.open("test-output/keyposes.png").convert("RGBA")
          assert raw.getchannel("A").getextrema() == (255, 255)
          assert clean.getchannel("A").getextrema()[0] == 0
          assert clean.getchannel("A").getextrema()[1] == 255

          # Generated chroma is not mathematically one RGB value. The central safe
          # gaps must nevertheless become fully transparent before 2x2 splitting.
          alpha = clean.getchannel("A")
          vertical_gap = alpha.crop((502, 0, 522, 1536))
          horizontal_gap = alpha.crop((0, 758, 1024, 778))
          assert vertical_gap.getextrema() == (0, 0), vertical_gap.getextrema()
          assert horizontal_gap.getextrema() == (0, 0), horizontal_gap.getextrema()

          chroma = json.loads(Path("test-output/keyposes-chroma.json").read_text(encoding="utf-8"))
          assert chroma["key_rgb"] == [255, 0, 255], chroma
          assert chroma["threshold"] == 42.0, chroma
          assert chroma["feather"] == 18.0, chroma
          assert chroma["pixels"]["cleared"] > 0, chroma
          PY

      - name: Build four-frame motion strip
        run: |
          python audit/scripts/build_motion_strip.py \
            test-output/keyposes.png \
            --spec audit/specs/motion-keypose-2x2.json \
            --output test-output/motion-4f.png \
            --debug-dir test-output/debug-4f

      - name: Build loop eight-frame motion strip
        run: |
          python audit/scripts/build_motion_strip.py \
            test-output/keyposes.png \
            --inbetween-board test-output/inbetweens.png \
            --frame-plan K1,I1,K2,I2,K3,I3,K4,I4 \
            --spec audit/specs/motion-keypose-2x2.json \
            --output test-output/motion-8f-loop.png \
            --debug-dir test-output/debug-8f-loop

      - name: Build one-shot eight-frame motion strip
        run: |
          python audit/scripts/build_motion_strip.py \
            test-output/keyposes.png \
            --inbetween-board test-output/inbetweens.png \
            --frame-plan K1,I1,K2,I2,I3,K3,I4,K4 \
            --spec audit/specs/motion-keypose-2x2.json \
            --output test-output/motion-8f-one-shot.png \
            --debug-dir test-output/debug-8f-one-shot

      - name: Verify motion strip outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          four = Image.open("test-output/motion-4f.png").convert("RGBA")
          loop = Image.open("test-output/motion-8f-loop.png").convert("RGBA")
          one_shot = Image.open("test-output/motion-8f-one-shot.png").convert("RGBA")
          assert four.size == (1024, 320), four.size
          assert loop.size == (2048, 320), loop.size
          assert one_shot.size == (2048, 320), one_shot.size
          assert four.getchannel("A").getextrema()[0] == 0
          assert loop.getchannel("A").getextrema()[0] == 0
          assert one_shot.getchannel("A").getextrema()[0] == 0

          four_meta = json.loads(Path("test-output/motion-4f.json").read_text(encoding="utf-8"))
          loop_meta = json.loads(Path("test-output/motion-8f-loop.json").read_text(encoding="utf-8"))
          one_shot_meta = json.loads(Path("test-output/motion-8f-one-shot.json").read_text(encoding="utf-8"))

          assert four_meta["frame_count"] == 4, four_meta
          assert four_meta["frame_order"] == ["K1", "K2", "K3", "K4"], four_meta
          assert loop_meta["frame_order"] == ["K1", "I1", "K2", "I2", "K3", "I3", "K4", "I4"], loop_meta
          assert one_shot_meta["frame_order"] == ["K1", "I1", "K2", "I2", "I3", "K3", "I4", "K4"], one_shot_meta
          assert loop_meta["frame_plan_source"] == "explicit", loop_meta
          assert one_shot_meta["frame_plan_source"] == "explicit", one_shot_meta
          assert len(list(Path("test-output/debug-4f").glob("keypose-*.png"))) == 4
          assert len(list(Path("test-output/debug-8f-loop").glob("inbetween-*.png"))) == 4
          assert len(list(Path("test-output/debug-8f-one-shot").glob("inbetween-*.png"))) == 4
          PY

      - name: Run 8x9 audit pipeline
        run: |
          python audit/scripts/audit_sprite.py \
            test-output/synthetic-atlas.png \
            --spec audit/specs/pet-atlas-8x9.json \
            --output-dir test-output/audit

      - name: Verify audit outputs
        run: |
          test -s test-output/audit/audit.json
          test -s test-output/audit/contact-sheet.png
          test -s test-output/audit/preview.gif
          test -s test-output/audit/normalized-spritesheet.webp
          python - <<'PY'
          import json
          report = json.load(open("test-output/audit/audit.json", encoding="utf-8"))
          assert report["passed"] is True, report
          assert len(report["rows"]) == 9
          PY
