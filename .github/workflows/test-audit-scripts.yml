name: Test sprite audit scripts

on:
  push:
    paths:
      - "scripts/**"
      - "specs/**"
      - "requirements.txt"
      - ".github/workflows/test-audit-scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "specs/**"
      - "requirements.txt"
      - ".github/workflows/test-audit-scripts.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Create synthetic 8x9 atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          image = Image.new("RGBA", (1536, 1872), (0, 0, 0, 0))
          draw = ImageDraw.Draw(image)
          for row in range(9):
              for column in range(8):
                  left = column * 192 + 64 + column * 4
                  top = row * 208 + 80
                  draw.ellipse(
                      (left, top, left + 56, top + 84),
                      fill=(70 + row * 12, 130, 220, 255),
                  )
          Path("test-output").mkdir(exist_ok=True)
          image.save("test-output/synthetic-atlas.png")
          PY

      - name: Run audit pipeline
        run: |
          python scripts/audit_sprite.py \
            test-output/synthetic-atlas.png \
            --spec specs/pet-atlas-8x9.json \
            --output-dir test-output/audit

      - name: Verify outputs
        run: |
          test -s test-output/audit/audit.json
          test -s test-output/audit/contact-sheet.png
          test -s test-output/audit/preview.gif
          test -s test-output/audit/normalized-spritesheet.webp
          python - <<'PY'
          import json
          report = json.load(open("test-output/audit/audit.json", encoding="utf-8"))
          assert report["passed"] is True, report
          assert len(report["rows"]) == 9
          PY
