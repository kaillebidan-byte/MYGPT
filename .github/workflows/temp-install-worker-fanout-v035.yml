name: temp-install-worker-fanout-v035
on:
  push:
    paths:
      - .github/workflows/temp-install-worker-fanout-v035.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch v0.3.5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('extensions/mygpt-worker-fanout-v3')

          p=root/'manifest.json'
          m=json.loads(p.read_text())
          m['version']='0.3.5'
          m['description']='Three-slot MYGPT Custom GPT preparer using AutoGPT upload/paste primitives in temporarily focused worker tabs plus Translation Loop runtime/send-readiness guards.'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')

          p=root/'chatgpt_adapter.js'
          s=p.read_text()
          old='''  // Upload completion is attachment-specific. Send readiness is checked only\n  // after the prompt is pasted, because prompt content can control button state.\n  function uploadReady(fileName, before, doc = document) {\n    return !isUploading(doc) && attachmentVisible(fileName, before, doc);\n  }'''
          new='''  // Match AutoGPT's ChatGPT upload-ready predicate. v0.3.5 executes this only\n  // while the worker tab is foregrounded, avoiding Vivaldi hidden-tab rendering stalls.\n  // Translation Loop send readiness is still checked after prompt paste.\n  function uploadReady(doc = document) {\n    const submit = getSubmitButton(doc);\n    return !isUploading(doc) && (!submit || (!submit.disabled && !isStopButton(submit)));\n  }'''
          assert old in s
          s=s.replace(old,new)
          old='''    await sleep(250);\n    const ready = await waitFor(() => uploadReady(made.file.name, beforeAttachment, doc), {\n      timeout: options.uploadTimeout || 90000,\n      interval: options.uploadInterval || 250\n    });\n    if (!ready) {\n      return { ok: false, reason: "ATTACHMENT_UI_NOT_CONFIRMED", name: made.file.name };\n    }\n\n    return {\n      ok: true,\n      evidence: "autogpt-upload+visible-attachment",\n      attachmentUiEvidence: ready.kind,\n      name: made.file.name,'''
          new='''    // AutoGPT polls on a ~2s cadence. Give ChatGPT a full first render turn so\n    // the pre-upload no-button state cannot be mistaken for completion.\n    await sleep(2000);\n    const ready = await waitFor(() => uploadReady(doc), {\n      timeout: options.uploadTimeout || 90000,\n      interval: options.uploadInterval || 2000\n    });\n    if (!ready) {\n      return { ok: false, reason: "UPLOAD_READY_TIMEOUT", name: made.file.name };\n    }\n\n    const visible = attachmentVisible(made.file.name, beforeAttachment, doc);\n    return {\n      ok: true,\n      evidence: "autogpt-upload-ready-foreground",\n      attachmentUiEvidence: visible?.kind || null,\n      name: made.file.name,'''
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          p=root/'background.js'
          s=p.read_text()
          s=s.replace('result.attachment?.evidence === "autogpt-upload+visible-attachment"','result.attachment?.evidence === "autogpt-upload-ready-foreground"')
          needle='''async function prepareStagedSlot(token, sourceIdentity, payload, staged) {'''
          helper='''async function focusTabForPrepare(tabId) {\n  const tab = await chrome.tabs.get(tabId);\n  await chrome.tabs.update(tabId, { active: true });\n  if (Number.isInteger(tab?.windowId)) {\n    try { await chrome.windows.update(tab.windowId, { focused: true }); } catch (_) {}\n  }\n  await new Promise((resolve) => setTimeout(resolve, 400));\n}\n\nasync function restoreSourceTab(sourceTabId) {\n  if (!Number.isInteger(sourceTabId)) return;\n  try {\n    const tab = await chrome.tabs.get(sourceTabId);\n    await chrome.tabs.update(sourceTabId, { active: true });\n    if (Number.isInteger(tab?.windowId)) {\n      try { await chrome.windows.update(tab.windowId, { focused: true }); } catch (_) {}\n    }\n  } catch (_) {}\n}\n\n'''+needle
          assert needle in s
          s=s.replace(needle,helper)
          needle='''  const { slotId, tabId } = staged;\n  if (!(await guard.isCurrent(token))) return { ok: false, slotId, tabId, error: "STALE_RUN" };\n\n  await mutateSlot(token, slotId, {'''
          repl='''  const { slotId, tabId } = staged;\n  if (!(await guard.isCurrent(token))) return { ok: false, slotId, tabId, error: "STALE_RUN" };\n\n  try {\n    await focusTabForPrepare(tabId);\n  } catch (error) {\n    await mutateSlot(token, slotId, {\n      phase: "ERROR",\n      error: { code: "WORKER_FOCUS_FAILED", detail: error instanceof Error ? error.message : String(error) }\n    });\n    return { ok: false, slotId, tabId, error: "WORKER_FOCUS_FAILED" };\n  }\n\n  await mutateSlot(token, slotId, {'''
          assert needle in s
          s=s.replace(needle,repl)
          old='''  const results = [];\n  // Preparation remains sequential to reduce hidden-tab contention; all three tabs\n  // are already staged empty before this loop begins.\n  for (const item of staged) {\n    if (!(await guard.isCurrent(token))) break;\n    results.push(await prepareStagedSlot(token, sourceIdentity, payload, item));\n  }'''
          new='''  const results = [];\n  // Keep isolated tabs, but foreground exactly one worker while its ChatGPT UI is\n  // being manipulated. This avoids Vivaldi hidden-tab DOM/render stalls without\n  // sharing conversation state between slots.\n  try {\n    for (const item of staged) {\n      if (!(await guard.isCurrent(token))) break;\n      results.push(await prepareStagedSlot(token, sourceIdentity, payload, item));\n    }\n  } finally {\n    await restoreSourceTab(sourceTabId);\n  }'''
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          p=root/'README.md'
          s=p.read_text()
          s=s.replace('Status: **v0.3.4 STATIC PASS candidate — visible attachment evidence + post-paste send-ready live re-test pending**','Status: **v0.3.5 STATIC PASS candidate — foregrounded worker preparation live re-test pending**')
          s=s.replace('This is the stripped-AutoGPT rebuild. v0.3.4 fixes the v0.3.3 pre-paste send-readiness deadlock.','This is the stripped-AutoGPT rebuild. v0.3.5 removes the v0.3.4 hidden-tab attachment-UI regression by foregrounding one isolated worker at a time during preparation.')
          note='''\n## v0.3.5 regression fix\n\nv0.3.4 could remain at `F2: PREPARING` because it required visible attachment UI while the worker tab stayed hidden. Vivaldi can defer ChatGPT DOM/render updates in background tabs. v0.3.5 keeps all three conversations isolated and pre-staged, but temporarily activates F2, then F3, then F4 while each worker is prepared, restoring the source tab afterward.\n\nThe upload predicate is returned to AutoGPT's original ChatGPT logic (`no upload spinner` plus usable/absent submit state) with a full 2-second initial render delay. Translation Loop's enabled-send-button guard remains after prompt paste as the final READY evidence. Attachment UI is diagnostic only and no longer blocks the flow.\n\n'''
          s=s.replace('\n## v0.3.4 live-fix\n',note+'## v0.3.4 live-fix\n')
          s=s.replace('## v0.3.4 live scope','## v0.3.5 live scope')
          s=s.replace('- attachment: `autogpt-upload+visible-attachment`','- attachment: `autogpt-upload-ready-foreground`')
          p.write_text(s)

          p=root/'tests/test_chatgpt_adapter.js'
          s=p.read_text()
          s=s.replace('assert.match(source, /autogpt-upload\\+visible-attachment/);','assert.match(source, /autogpt-upload-ready-foreground/);')
          s=s.replace('assert.doesNotMatch(source, /!submit \\|\\|/);','assert.match(source, /!submit \\|\\|/);')
          if 'await sleep\\(2000\\)' not in s:
            s=s.replace('assert.match(source, /function attachmentVisible/);','assert.match(source, /function attachmentVisible/);\nassert.match(source, /await sleep\\(2000\\)/);')
          p.write_text(s)

          p=root/'tests/test_v3_safety.js'
          s=p.read_text()
          s=s.replace('assert.ok(source.includes("autogpt-upload+visible-attachment"));','assert.ok(source.includes("autogpt-upload-ready-foreground"));\nassert.ok(source.includes("focusTabForPrepare"));\nassert.ok(source.includes("restoreSourceTab"));')
          s=s.replace('MYGPT Worker Fanout v3.4 safety contract: PASS','MYGPT Worker Fanout v3.5 safety contract: PASS')
          p.write_text(s)
          PY
      - name: Static tests
        run: |
          set -e
          cd extensions/mygpt-worker-fanout-v3
          python -m json.tool manifest.json >/dev/null
          for f in *.js tests/*.js; do node --check "$f"; done
          for t in tests/*.js; do node "$t"; done
      - name: Commit and self-clean
        run: |
          rm .github/workflows/temp-install-worker-fanout-v035.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extensions/mygpt-worker-fanout-v3 .github/workflows/temp-install-worker-fanout-v035.yml
          git commit -m "Worker Fanout v0.3.5: foreground isolated worker preparation"
          git push origin HEAD:main
