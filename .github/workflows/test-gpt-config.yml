name: Test GPT configuration

on:
  push:
    paths:
      - "gpt/**"
      - "README.md"
      - "PRIVACY.md"
      - "audit/docs/**"
      - "audit/scripts/build_motion_strip.py"
      - "audit/specs/motion-keypose-2x2.json"
      - ".github/workflows/audit-sprite.yml"
      - ".github/workflows/test-gpt-config.yml"
  pull_request:
    paths:
      - "gpt/**"
      - "README.md"
      - "PRIVACY.md"
      - "audit/docs/**"
      - "audit/scripts/build_motion_strip.py"
      - "audit/specs/motion-keypose-2x2.json"
      - ".github/workflows/audit-sprite.yml"
      - ".github/workflows/test-gpt-config.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: >-
          python -m pip install
          openapi-spec-validator==0.7.2
          PyYAML==6.0.2

      - name: Validate reconstructed GPT configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          import yaml
          from openapi_spec_validator import validate_spec

          required = [
              "gpt/production/README.md",
              "gpt/production/instructions.md",
              "gpt/production/description.md",
              "gpt/production/conversation-starters.md",
              "gpt/production/builder-settings.md",
              "gpt/knowledge/README.md",
              "gpt/knowledge/character-identity-reference.md",
              "gpt/knowledge/motion-vocabulary.md",
              "gpt/knowledge/sprite-output-spec.md",
              "gpt/experimental-audit/README.md",
              "gpt/experimental-audit/instructions-addon.md",
              "gpt/experimental-audit/github-audit-openapi.yaml",
              "gpt/experimental-audit/test-cases.md",
              "audit/scripts/build_motion_strip.py",
              "audit/specs/motion-keypose-2x2.json",
              "audit/docs/keypose-motion-pipeline.md",
              ".github/workflows/audit-sprite.yml",
          ]

          for item in required:
              path = Path(item)
              assert path.is_file(), f"Missing required file: {item}"
              assert path.read_text(encoding="utf-8").strip(), f"Empty required file: {item}"

          for path in Path("gpt").rglob("*.md"):
              text = path.read_text(encoding="utf-8")
              assert "次段階で作成" not in text, f"Unfinished placeholder in {path}"
              assert "作成予定" not in text, f"Unfinished placeholder in {path}"

          instructions = Path("gpt/production/instructions.md").read_text(encoding="utf-8")
          for required_phrase in [
              "画像生成機能を直接使用する",
              "単一画像モード",
              "モーション素材モード",
              "4つの大きなキーポーズを2×2配置",
              "同じ画像の複製や単純な水増しで8フレームにしない",
              "character-identity-reference.md",
              "sprite-output-spec.md",
              "画像表示の成功条件",
              "画像が会話画面へ実際に表示された場合だけ成功",
              "同じ依頼で画像生成機能を一度だけ再実行する",
              "画像を会話内に表示できませんでした。もう一度生成を依頼してください。",
          ]:
              assert required_phrase in instructions, f"Production instruction missing: {required_phrase}"

          for failure_marker in [
              "/mnt/data/...",
              "sandbox:/...",
              "ファイル名だけが返った",
              "内部パスをMarkdownリンクへ変換して代用しない",
          ]:
              assert failure_marker in instructions, (
                  f"Production instructions do not cover path-only failure: {failure_marker}"
              )

          for forbidden_phrase in [
              "openaiFileIdRefs",
              "repository_dispatch",
              "dispatchSpriteAudit",
          ]:
              assert forbidden_phrase not in instructions, (
                  f"Production instructions contain audit detail: {forbidden_phrase}"
              )

          production_readme = Path("gpt/production/README.md").read_text(encoding="utf-8")
          assert "モーションのフレーム数が未指定なら8フレーム" not in production_readme
          assert "画像本体が会話画面へ表示された場合だけ成功" in production_readme
          assert "内部パスだけが返らないことを回帰確認する" in production_readme

          builder_settings = Path("gpt/production/builder-settings.md").read_text(encoding="utf-8")
          for required_phrase in [
              "画像表示の回帰試験",
              "/mnt/data/...だけが表示された",
              "ファイル名だけが表示された",
              "Image generationがON",
              "Code Interpreter & Data AnalysisがOFF",
          ]:
              assert required_phrase in builder_settings, (
                  f"Builder settings missing output regression check: {required_phrase}"
              )

          motion_spec = json.loads(
              Path("audit/specs/motion-keypose-2x2.json").read_text(encoding="utf-8")
          )
          assert motion_spec["input"]["columns"] == 2
          assert motion_spec["input"]["rows"] == 2
          assert len(motion_spec["input"]["keypose_order"]) == 4
          assert len(motion_spec["input"]["inbetween_order"]) == 4
          assert motion_spec["output"]["cell_width"] > 0
          assert motion_spec["output"]["cell_height"] > 0

          builder_text = Path("audit/scripts/build_motion_strip.py").read_text(encoding="utf-8")
          for required_phrase in [
              "--inbetween-board",
              "common_scale",
              "must contain transparent background pixels",
              "too close to cell edges",
          ]:
              assert required_phrase in builder_text, f"Motion builder missing: {required_phrase}"

          spec_path = Path("gpt/experimental-audit/github-audit-openapi.yaml")
          spec = yaml.safe_load(spec_path.read_text(encoding="utf-8"))
          validate_spec(spec)

          operations = {
              operation.get("operationId")
              for path_item in spec["paths"].values()
              for method, operation in path_item.items()
              if method.lower() in {"get", "post", "put", "patch", "delete"}
          }
          assert operations == {"submitSpriteAudit", "getSpriteAudit"}, operations

          server_url = spec["servers"][0]["url"]
          parsed = urlparse(server_url)
          assert parsed.scheme == "https" and parsed.hostname, "Audit receiver must use HTTPS"
          assert parsed.hostname != "api.github.com", "Do not point the receiver schema at GitHub API"

          workflow = yaml.load(
              Path(".github/workflows/audit-sprite.yml").read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          assert "on" in workflow, "Workflow trigger is missing"
          assert "jobs" in workflow and "audit" in workflow["jobs"], "Audit job is missing"

          workflow_text = Path(".github/workflows/audit-sprite.yml").read_text(encoding="utf-8")
          for required_phrase in [
              "AUDIT_IMAGE_HOST",
              "image_url",
              "audit/scripts/audit_sprite.py",
              "audit/specs/pet-atlas-8x9.json",
          ]:
              assert required_phrase in workflow_text, f"Audit workflow missing: {required_phrase}"
          assert "openaiFileIdRefs" not in workflow_text, (
              "GitHub workflow must not consume OpenAI file references directly"
          )

          print("GPT configuration validation passed")
          PY
