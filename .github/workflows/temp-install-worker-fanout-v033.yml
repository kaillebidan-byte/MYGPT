name: temp-install-worker-fanout-v033
on:
  push:
    paths:
      - .github/workflows/temp-install-worker-fanout-v033.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch v0.3.3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('extensions/mygpt-worker-fanout-v3')

          guard = r'''"use strict";

/*
 * MAIN-world send-control readiness guard adapted directly from the
 * Translation Loop 0.5.1 Prompt Stacker runner, itself adapted from
 * thegreatLUCY/prompt-stacker content.js commit
 * 5a01391c124ecc1d8f4cc8c4538883cec6bde1c3.
 *
 * Only selector scoping + enabled-state detection are retained here.
 * No activation path exists in this module. See LICENSE-PROMPT-STACKER.
 */
(function installTranslationLoopSendGuard(globalScope) {
  const SEND_SELECTORS = Object.freeze([
    '#composer-submit-button',
    'button[data-testid="send-button"]',
    'button[data-testid*="composer-send"]',
    'button[aria-label*="Send" i]',
    'button[aria-label*="送信" i]',
    'button[type="submit"]'
  ]);
  const GLOBAL_SEND_SELECTORS = Object.freeze([
    '#composer-submit-button',
    'button[data-testid="send-button"]',
    'button[data-testid*="composer-send"]',
    'button[type="submit"][data-testid*="send"]'
  ]);
  function enabledCandidate(selectors, root, acceptNode = () => true) {
    if (!root?.querySelectorAll) return null;
    for (const selector of selectors) {
      let nodes = [];
      try { nodes = root.querySelectorAll(selector); } catch (_) { continue; }
      for (const candidate of nodes) {
        if (!acceptNode(candidate)) continue;
        const disabled = candidate.disabled ||
          candidate.getAttribute?.("aria-disabled") === "true" ||
          candidate.getAttribute?.("data-disabled") === "true";
        if (!disabled) return candidate;
      }
    }
    return null;
  }
  function getEnabledSendButton(editor = null, doc = document) {
    const roots = [];
    const addRoot = (node) => {
      if (node && node !== doc?.body && node !== doc?.documentElement && !roots.includes(node)) roots.push(node);
    };
    addRoot(editor?.closest?.("form"));
    addRoot(editor?.closest?.('[data-testid*="composer"]'));
    addRoot(editor?.closest?.('[class*="composer"]'));
    let parent = editor?.parentElement || null;
    for (let depth = 0; parent && depth < 2; depth += 1) {
      addRoot(parent); parent = parent.parentElement;
    }
    for (const root of roots) {
      const candidate = enabledCandidate(SEND_SELECTORS, root);
      if (candidate) return candidate;
    }
    return enabledCandidate(GLOBAL_SEND_SELECTORS, doc);
  }
  const api = Object.freeze({ SEND_SELECTORS, GLOBAL_SEND_SELECTORS, enabledCandidate, getEnabledSendButton });
  globalScope.MYGPTTranslationLoopSendGuard = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : this);
'''
          (root/'translation_loop_send_guard.js').write_text(guard)

          license_text = '''MIT License\n\nCopyright (c) 2026 thegreatLUCY\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the "Software"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n'''
          (root/'LICENSE-PROMPT-STACKER').write_text(license_text)

          p = root/'chatgpt_adapter.js'
          s = p.read_text()
          old = '''  function uploadReady(doc = document) {\n    const submit = getSubmitButton(doc);\n    return !isUploading(doc) && (!submit || (!submit.disabled && !isStopButton(submit)));\n  }\n\n  function editorText(editor) {'''
          new = '''  function getTranslationLoopSendButton(doc = document) {\n    const guard = globalScope.MYGPTTranslationLoopSendGuard;\n    if (!guard?.getEnabledSendButton) return null;\n    return guard.getEnabledSendButton(getPromptRoot(doc) || getPromptEditor(doc), doc);\n  }\n\n  // AutoGPT supplies upload mechanics; Translation Loop supplies the stronger\n  // positive READY evidence. A temporarily absent React button is never READY.\n  function uploadReady(doc = document) {\n    return !isUploading(doc) && Boolean(getTranslationLoopSendButton(doc));\n  }\n\n  function editorText(editor) {'''
          assert old in s
          s = s.replace(old, new)
          old = '''  function composerDraftText(doc = document) {\n    return editorText(getPromptRoot(doc) || getPromptEditor(doc));\n  }'''
          new = '''  function composerStructuredText(doc = document) {\n    const root = getPromptRoot(doc);\n    if (!root) return editorText(getPromptEditor(doc));\n    if (root.tagName === "TEXTAREA" || root.tagName === "INPUT") return editorText(root);\n    const paragraphs = Array.from(root.querySelectorAll?.("p") || []);\n    if (paragraphs.length) {\n      return normalizeText(paragraphs.map((node) => normalizeText(node.innerText || node.textContent || "")).join("\\n"));\n    }\n    return editorText(root);\n  }\n\n  function composerDraftText(doc = document) {\n    return composerStructuredText(doc);\n  }'''
          assert old in s
          s = s.replace(old, new)
          s = s.replace('''    // AutoGPT's ChatGPT adapter waits on the composer's upload state rather than filename text.\n    // Do not accept the synchronous post-dispatch state; allow ChatGPT one event turn first.\n    await sleep(250);\n    const ready = await waitFor(() => uploadReady(doc), {\n      timeout: options.uploadTimeout || 90000,\n      interval: options.uploadInterval || 2000\n    });''', '''    // AutoGPT performs the upload; Translation Loop's enabled send control is\n    // the final positive READY gate.\n    await sleep(250);\n    const ready = await waitFor(() => uploadReady(doc), {\n      timeout: options.uploadTimeout || 90000,\n      interval: options.uploadInterval || 250\n    });''')
          s = s.replace('evidence: "autogpt-upload-ready"', 'evidence: "autogpt-upload+translation-loop-send-ready"')
          s = s.replace('''      const current = getPromptEditor(doc);\n      const readback = getPromptRoot(doc) || current;\n      observed = editorText(readback);\n      return observed === expected ? current : null;''', '''      const current = getPromptEditor(doc);\n      observed = composerStructuredText(doc);\n      return observed === expected ? current : null;''')
          s = s.replace('''    getSubmitButton,\n    isUploading,''', '''    getSubmitButton,\n    getTranslationLoopSendButton,\n    isUploading,''')
          s = s.replace('''    editorText,\n    composerDraftText,''', '''    editorText,\n    composerStructuredText,\n    composerDraftText,''')
          p.write_text(s)

          p = root/'manifest.json'
          m = json.loads(p.read_text())
          m['version'] = '0.3.3'
          m['description'] = 'Three-slot MYGPT Custom GPT preparer using AutoGPT upload/paste primitives plus Translation Loop runtime and send-readiness guards.'
          js = m['content_scripts'][0]['js']
          if 'translation_loop_send_guard.js' not in js:
            js.insert(js.index('chatgpt_adapter.js'), 'translation_loop_send_guard.js')
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')

          p = root/'background.js'
          s = p.read_text()
          s = s.replace('const MAIN_FILES = ["page_observer.js", "chatgpt_adapter.js"];', 'const MAIN_FILES = ["page_observer.js", "translation_loop_send_guard.js", "chatgpt_adapter.js"];')
          s = s.replace('func: () => Boolean(globalThis.MYGPTChatGPTAdapter)', 'func: () => Boolean(globalThis.MYGPTTranslationLoopSendGuard && globalThis.MYGPTChatGPTAdapter)')
          s = s.replace('result.attachment?.evidence === "autogpt-upload-ready"', 'result.attachment?.evidence === "autogpt-upload+translation-loop-send-ready"')
          p.write_text(s)

          p = root/'README.md'
          s = p.read_text()
          s = s.replace('Status: **v0.3.2 STATIC PASS candidate — full-root readback + pre-staged tabs live re-test pending**', 'Status: **v0.3.3 STATIC PASS candidate — paragraph readback + Translation Loop upload-ready guard live re-test pending**')
          s = s.replace('This is the stripped-AutoGPT rebuild. v0.3.2 keeps the MAIN-world AutoGPT path and fixes the remaining READY verification/tab-staging issues.', 'This is the stripped-AutoGPT rebuild. v0.3.3 keeps the proven MAIN-world AutoGPT upload/paste path and replaces only the weak READY/readback checks.')
          s = s.replace('- `runtime_guard.js` reused for serialized state mutation / runToken', '- `runtime_guard.js` reused for serialized state mutation / runToken\n  - Prompt Stacker `enabledCandidate/getSendButton` logic adapted into `translation_loop_send_guard.js` for positive composer-send readiness')
          note = '''\n## v0.3.3 live-fix\n\nThe v0.3.2 live run proved all three synthetic pastes succeeded. ChatGPT renders each logical newline as a separate `<p>`, while `innerText` adds blank lines between paragraphs (`expectedChars:48`, `observedChars:50`). v0.3.3 verifies logical prompt text by reading each `#prompt-textarea p` and joining paragraphs with one newline.\n\nOne tab also reported upload-ready while the canonical was visibly absent. v0.3.3 keeps AutoGPT's `DataTransfer -> input.files -> change` upload path but replaces the weak `submit absent = ready` shortcut with Translation Loop's composer-local enabled-button lookup. READY requires no upload spinner plus a real enabled composer send control. There is still no send/click/Enter path.\n\n'''
          s = s.replace('\n## v0.3.2 live-fix\n', note + '## v0.3.2 live-fix\n')
          s = s.replace('## v0.3.2 live scope', '## v0.3.3 live scope')
          s = s.replace('wait for AutoGPT-style composer upload-ready state;', 'wait for AutoGPT upload completion plus Translation Loop composer-send readiness;')
          s = s.replace('- attachment: `autogpt-upload-ready`', '- attachment: `autogpt-upload+translation-loop-send-ready`')
          s = s.replace('but v0.3.2 does not trigger submission', 'but v0.3.3 does not trigger submission')
          p.write_text(s)

          p = root/'tests/test_chatgpt_adapter.js'
          s = p.read_text().replace('assert.match(source, /2000/);\n','')
          s = s.replace('assert.match(source, /const readback = getPromptRoot\\(doc\\) \\|\\| current/);', 'assert.match(source, /function composerStructuredText/);\nassert.match(source, /paragraphs\\.map/);\nassert.match(source, /MYGPTTranslationLoopSendGuard/);\nassert.match(source, /autogpt-upload\\+translation-loop-send-ready/);\nassert.doesNotMatch(source, /!submit \\|\\|/);')
          p.write_text(s)

          (root/'tests/test_translation_loop_send_guard.js').write_text(r'''"use strict";
const assert = require("node:assert/strict");
const fs = require("node:fs");
const path = require("node:path");
const guard = require("../translation_loop_send_guard.js");
assert.ok(guard.SEND_SELECTORS.includes('#composer-submit-button'));
assert.equal(typeof guard.enabledCandidate, "function");
assert.equal(typeof guard.getEnabledSendButton, "function");
const enabled = { disabled: false, getAttribute: () => null };
const ariaDisabled = { disabled: false, getAttribute: (name) => name === "aria-disabled" ? "true" : null };
const mockRoot = { querySelectorAll: () => [ariaDisabled, enabled] };
assert.equal(guard.enabledCandidate(["button"], mockRoot), enabled);
const source = fs.readFileSync(path.resolve(__dirname, "../translation_loop_send_guard.js"), "utf8");
assert.match(source, /aria-disabled/);
assert.match(source, /data-disabled/);
assert.doesNotMatch(source, /\.click\s*\(/);
assert.doesNotMatch(source, /KeyboardEvent/);
assert.doesNotMatch(source, /\.requestSubmit\s*\(/);
console.log("Translation Loop send readiness guard: PASS");
''')

          p = root/'tests/test_v3_safety.js'
          s = p.read_text()
          s = s.replace('"chatgpt_adapter.js", "content.js", "background.js", "popup.js"', '"translation_loop_send_guard.js", "chatgpt_adapter.js", "content.js", "background.js", "popup.js"')
          s = s.replace('assert.ok(manifest.content_scripts[0].js.includes("chatgpt_adapter.js"));', 'assert.ok(manifest.content_scripts[0].js.includes("translation_loop_send_guard.js"));\nassert.ok(manifest.content_scripts[0].js.includes("chatgpt_adapter.js"));')
          s = s.replace('assert.ok(source.includes("autogpt-upload-ready"));', 'assert.ok(source.includes("autogpt-upload+translation-loop-send-ready"));\nassert.ok(source.includes("MYGPTTranslationLoopSendGuard"));\nassert.ok(source.includes("enabledCandidate"));')
          s = s.replace('MYGPT Worker Fanout v3.2 safety contract: PASS', 'MYGPT Worker Fanout v3.3 safety contract: PASS')
          p.write_text(s)
          PY
      - name: Static tests
        run: |
          set -e
          cd extensions/mygpt-worker-fanout-v3
          python -m json.tool manifest.json >/dev/null
          for f in *.js tests/*.js; do node --check "$f"; done
          for t in tests/*.js; do node "$t"; done
      - name: Commit and self-clean
        run: |
          rm .github/workflows/temp-install-worker-fanout-v033.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extensions/mygpt-worker-fanout-v3 .github/workflows/temp-install-worker-fanout-v033.yml
          git commit -m "Worker Fanout v0.3.3: reuse Translation Loop send readiness"
          git push origin HEAD:main
